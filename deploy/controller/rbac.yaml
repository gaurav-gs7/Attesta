apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: attesta-controller
rules:
  - apiGroups: ["attesta.io"]
    resources: ["rolloutguards"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["attesta.io"]
    resources: ["rolloutguards/status"]
    verbs: ["get", "patch", "update"]
  # Read-only. The right to update Deployments is in rollback-rbac.yaml so it
  # can be bound per namespace instead of cluster-wide.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  # Events about guards (events.k8s.io), and the leader-election events
  # controller-runtime still writes through the core API.
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch", "update"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: attesta-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: attesta-controller
subjects:
  - kind: ServiceAccount
    name: attesta-controller
    namespace: attesta-system
---
# Leader election Lease, scoped to the controller's own namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: attesta-controller-leader-election
  namespace: attesta-system
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: attesta-controller-leader-election
  namespace: attesta-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: attesta-controller-leader-election
subjects:
  - kind: ServiceAccount
    name: attesta-controller
    namespace: attesta-system
