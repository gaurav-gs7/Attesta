prometheus:
  prometheusSpec:
    # Attesta computes the remaining error budget over 30 days, so keep at
    # least that much history.
    retention: 31d
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi

grafana:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 512Mi
