apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: attesta-system
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - rbac.yaml
  - rollback-rbac.yaml
  - canary-rbac.yaml
  - decision-protection.yaml
  - deployment.yaml
  - service.yaml
  - pdb.yaml
# Pin a release before deploying anywhere that matters, for example:
#   kustomize edit set image attesta-controller=ghcr.io/gaurav-gs7/attesta-controller:v0.2.0
# or by digest. Images are published by .github/workflows/release.yml.
images:
  - name: attesta-controller
    newName: ghcr.io/gaurav-gs7/attesta-controller
    newTag: main
