services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: attesta
      POSTGRES_USER: attesta
      POSTGRES_PASSWORD: attesta
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attesta -d attesta"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - attesta-postgres:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: cmd/attesta-api/Dockerfile
    environment:
      ATTESTA_ADDR: ":8080"
      DATABASE_URL: "postgres://attesta:attesta@postgres:5432/attesta?sslmode=disable"
      ATTESTA_TEMPLATE_DIR: "/app/templates"
      ATTESTA_API_TOKEN: "local-dev-token"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    # The API writes nothing to disk.
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  attesta-postgres:
