name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.x"

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # The workflow idempotency tests run against both stores; this is the
      # PostgreSQL one.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: attesta
          POSTGRES_PASSWORD: attesta
          POSTGRES_DB: attesta
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U attesta"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ATTESTA_TEST_DATABASE_URL: postgres://attesta:attesta@localhost:5432/attesta?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi
      - name: Check go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Vet
        run: go vet ./...
      - name: Install envtest binaries (kube-apiserver and etcd)
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@v0.25.4-0.20261123171039-055e78270477
          echo "KUBEBUILDER_ASSETS=$(setup-envtest use 1.35.x -p path)" >> "$GITHUB_ENV"
      - name: Test with race detector
        env:
          # The controller's envtest suite fails rather than skips here.
          ATTESTA_REQUIRE_ENVTEST: "1"
        run: go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...
      - name: Coverage at least COVERAGE_MIN
        env:
          # Raise it as coverage grows; never lower it to make a change pass.
          COVERAGE_MIN: "68"
        run: |
          total="$(go tool cover -func=coverage.out | awk '/^total:/ { sub(/%/, "", $3); print $3 }')"
          echo "statement coverage: ${total}% (minimum ${COVERAGE_MIN}%)"
          awk -v t="$total" -v m="$COVERAGE_MIN" 'BEGIN { exit !(t >= m) }'
      - name: Build binaries
        run: make build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          args: --max-issues-per-linter=0 --max-same-issues=0
      - name: ShellCheck
        run: shellcheck scripts/*.sh

  vulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  manifests:
    name: Validate manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install kustomize and kubeconform
        run: |
          go install sigs.k8s.io/kustomize/kustomize/v5@v5.8.3
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0
      - name: Render and validate
        run: |
          kustomize build deploy/crds > crds.yaml
          kustomize build deploy/controller > controller.yaml
          kustomize build test/e2e > e2e.yaml
          kubeconform -strict -summary -kubernetes-version 1.32.0 controller.yaml e2e.yaml
          test "$(grep -c '^kind: CustomResourceDefinition' crds.yaml)" -eq 3
      - name: CRDs and deepcopy match the API types
        run: |
          go install sigs.k8s.io/controller-tools/cmd/controller-gen@v0.23.0
          make generate
          git diff --exit-code -- api deploy/crds
      - name: Render and validate the generated scaffold's overlays
        # The TestRendered* tests need kustomize and kubeconform, which only
        # this job installs; here they fail rather than skip without them.
        env:
          ATTESTA_REQUIRE_KUSTOMIZE: "1"
        run: go test -count=1 -run '^TestRendered' -v ./internal/templates
      - name: Lint workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          actionlint

  images:
    name: Build images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - name: attesta-controller
            dockerfile: cmd/attesta-controller/Dockerfile
          - name: attesta-api
            dockerfile: cmd/attesta-api/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ${{ matrix.name }}:ci
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Image runs as non-root
        run: |
          user="$(docker image inspect --format '{{.Config.User}}' ${{ matrix.name }}:ci)"
          echo "image user: $user"
          test "$user" = "65532:65532"
      - name: Controller reports its version
        if: matrix.name == 'attesta-controller'
        run: test "$(docker run --rm attesta-controller:ci --version)" = "${{ github.sha }}"
      - name: Scan the image
        # Pinned to a commit, as is the scanner it downloads: both tags were
        # hijacked in March 2026. Fails on fixable HIGH and CRITICAL findings.
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ${{ matrix.name }}:ci
          version: v0.69.3
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  e2e:
    name: End-to-end rollback on kind
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [test]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: attesta-e2e
      - name: Build and load the controller image
        run: |
          docker build -f cmd/attesta-controller/Dockerfile --build-arg VERSION=e2e -t attesta-controller:e2e .
          kind load docker-image attesta-controller:e2e --name attesta-e2e
      - name: Run end-to-end test
        run: bash scripts/e2e-rollback.sh
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: The decision chains verify, guard heads included
        run: kubectl get rolloutguards,rolloutdecisions -n attesta-e2e -o json | go run ./cmd/attesta verify
      - name: The scaffold's custom resources pass the CRD schemas
        # The CRDs are installed by the test above. A server-side dry run
        # checks enums, patterns and ranges, not only field names.
        run: |
          ATTESTA_WRITE_SCAFFOLD=/tmp/scaffold go test -count=1 -run '^TestWriteScaffoldForE2E$' ./internal/templates
          kubectl create namespace payments --dry-run=client -o yaml | kubectl apply -f -
          for f in attesta-service slo rollout; do
            kubectl apply --dry-run=server -f "/tmp/scaffold/payments-api/$f.yaml"
          done
          # And the schema is enforced: an unknown strategy is refused.
          if sed 's/^  strategy: .*/  strategy: yolo/' /tmp/scaffold/payments-api/rollout.yaml | kubectl apply --dry-run=server -f - 2>/tmp/err; then
            echo "an invalid RolloutGuard was accepted"; exit 1
          fi
          grep -q 'Unsupported value: "yolo"' /tmp/err
