apiVersion: apps/v1
kind: Deployment
metadata:
  name: attesta-controller
  namespace: attesta-system
  labels:
    app.kubernetes.io/name: attesta-controller
    app.kubernetes.io/managed-by: attesta
spec:
  # Two replicas with leader election: one reconciles, the other takes over
  # within one lease duration if the leader's node goes away.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: attesta-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: attesta-controller
        app.kubernetes.io/managed-by: attesta
    spec:
      serviceAccountName: attesta-controller
      volumes: []
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: attesta-controller
      containers:
        - name: controller
          # Resolved by the images entry in kustomization.yaml.
          image: attesta-controller
          imagePullPolicy: IfNotPresent
          args:
            - --resync=30s
            - --leader-elect=true
            - --metrics-addr=:8080
            - --health-addr=:8081
            # Enable metric analysis for guards that set spec.checks:
            # - --prometheus-url=http://prometheus-operated.monitoring.svc:9090
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          # Filled by components/signing and components/archive when used.
          volumeMounts: []
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
