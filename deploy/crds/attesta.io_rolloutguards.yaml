---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: rolloutguards.attesta.io
spec:
  group: attesta.io
  names:
    kind: RolloutGuard
    listKind: RolloutGuardList
    plural: rolloutguards
    shortNames:
    - rguard
    singular: rolloutguard
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.serviceRef
      name: Service
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.reason
      name: Reason
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: |-
          RolloutGuard watches one Deployment's rollouts. It reports their state
          and, when rollback is enabled and the Deployment consents, restores the
          last healthy pod template on ProgressDeadlineExceeded or failed metric
          checks.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              checks:
                description: |-
                  Checks are metric checks of each new revision. Analysis runs when at
                  least one threshold is set and the controller has --prometheus-url.
                properties:
                  errorRateThreshold:
                    description: ErrorRateThreshold is the highest acceptable 5xx
                      percentage.
                    maximum: 100
                    minimum: 0
                    type: number
                  interval:
                    description: Interval is the time between checks (default 30s,
                      at least 5s).
                    pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$
                    type: string
                  latencyP95ThresholdMs:
                    description: LatencyP95ThresholdMs is the highest acceptable p95
                      latency.
                    exclusiveMinimum: true
                    minimum: 0
                    type: number
                  minAvailability:
                    description: MinAvailability is the lowest acceptable success
                      percentage.
                    maximum: 100
                    minimum: 0
                    type: number
                  minRequests:
                    description: MinRequests is the traffic a check needs before it
                      judges (default 20).
                    minimum: 0
                    type: number
                  revisionLabel:
                    description: |-
                      RevisionLabel is the metric label holding the pod-template-hash
                      (default pod_template_hash); empty measures the whole service.
                    pattern: ^([a-zA-Z_][a-zA-Z0-9_]*)?$
                    type: string
                  successfulChecks:
                    description: |-
                      SuccessfulChecks is how many consecutive passes mark the revision
                      healthy (default 3).
                    format: int32
                    minimum: 1
                    type: integer
                  window:
                    description: Window is the range each check queries (default 2m,
                      at least 10s).
                    pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$
                    type: string
                type: object
              deploymentRef:
                description: |-
                  DeploymentRef names the Deployment in the guard's namespace. Default:
                  ServiceRef, else the guard's name without a "-rollout" suffix.
                maxLength: 253
                type: string
              rollback:
                properties:
                  consecutiveFailures:
                    description: |-
                      ConsecutiveFailures is how many failed metric checks in a row trigger
                      a rollback (default 2).
                    format: int32
                    minimum: 1
                    type: integer
                  enabled:
                    description: |-
                      Enabled lets the controller roll the Deployment back. The Deployment
                      must also name this guard in its attesta.io/rollback-guards annotation.
                    type: boolean
                type: object
              serviceRef:
                description: |-
                  ServiceRef is the value of the "service" label the service's metrics
                  carry, and the Deployment's name when DeploymentRef is empty.
                maxLength: 63
                type: string
              sloGate:
                description: |-
                  SLOGate checks the service's SLOs when a new revision starts rolling
                  out, with the same evaluator as the API's SLO status, and pauses the
                  rollout when they are breached.
                properties:
                  availabilityTarget:
                    description: |-
                      AvailabilityTarget is the SLO, as a percentage of requests that
                      succeed over 30 days. It sets the error budget.
                    exclusiveMaximum: true
                    exclusiveMinimum: true
                    maximum: 100
                    minimum: 0
                    type: number
                  errorRateThreshold:
                    description: |-
                      ErrorRateThreshold is the 5-minute error rate, in percent, above
                      which a rollout is not started (default 1).
                    maximum: 100
                    minimum: 0
                    type: number
                  fastBurnRate:
                    description: |-
                      FastBurnRate blocks a revision while the 1h and 5m burn rates are
                      both at or above it (default 14.4: 2% of a 30-day budget an hour).
                    exclusiveMinimum: true
                    minimum: 0
                    type: number
                  latencyP95TargetMs:
                    description: LatencyP95TargetMs is the p95 latency objective (default
                      300).
                    format: int32
                    minimum: 1
                    type: integer
                  minErrorBudgetPct:
                    description: |-
                      MinErrorBudgetPct blocks a revision while less of the 30-day error
                      budget remains (default 10).
                    maximum: 100
                    minimum: 0
                    type: number
                  onUnknown:
                    description: |-
                      OnUnknown is what happens when the SLOs cannot be measured (too
                      little traffic, no data, Prometheus unreachable): Proceed (default) or
                      Pause.
                    enum:
                    - Proceed
                    - Pause
                    type: string
                  recheckInterval:
                    description: |-
                      RecheckInterval is how often a paused revision is measured again
                      (default 1m, at least 10s).
                    pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$
                    type: string
                  resume:
                    description: |-
                      Resume is what ends a pause: Automatic (default) resumes the rollout
                      once the gate allows it again, checked every RecheckInterval; Manual
                      leaves it to a person (kubectl rollout resume).
                    enum:
                    - Automatic
                    - Manual
                    type: string
                  slowBurnRate:
                    description: |-
                      SlowBurnRate blocks a revision while the 6h and 30m burn rates are
                      both at or above it (default 6: 5% of the budget in six hours).
                    exclusiveMinimum: true
                    minimum: 0
                    type: number
                required:
                - availabilityTarget
                type: object
              steps:
                description: |-
                  Steps are ignored. Deprecated: they described traffic shifting that
                  Attesta does not do, and will be removed from the API.
                items:
                  properties:
                    duration:
                      pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$
                      type: string
                    weight:
                      format: int32
                      maximum: 100
                      minimum: 0
                      type: integer
                  required:
                  - weight
                  type: object
                maxItems: 20
                type: array
              strategy:
                description: |-
                  Strategy is a label, recorded and reported, nothing more. Attesta
                  does not shift traffic: whatever the strategy, the Deployment does a
                  standard rolling update, and the controller judges the new revision's
                  pods as they take their share of traffic.
                enum:
                - rolling
                - canary
                - blue-green
                type: string
            type: object
          status:
            description: RolloutGuardStatus is written by the controller only.
            properties:
              analysis:
                description: |-
                  Analysis tracks metric checks of the revision rolling out. Absent when
                  analysis is off or the Deployment is on the healthy template.
                properties:
                  candidateGeneration:
                    format: int64
                    type: integer
                  candidateRevision:
                    type: string
                  candidateTemplateHash:
                    type: string
                  consecutiveFailures:
                    format: int32
                    type: integer
                  consecutivePasses:
                    format: int32
                    type: integer
                  errorRatePct:
                    type: number
                  lastCheckTime:
                    type: string
                  lastEvidence:
                    description: |-
                      LastEvidence is the queries and values of the last check, copied into
                      the decision record when the check decides.
                    items:
                      description: DecisionEvidence is one measurement behind a decision.
                      properties:
                        evaluatedAt:
                          description: EvaluatedAt is when the value was read, RFC
                            3339.
                          type: string
                        name:
                          description: |-
                            Name is the check: requests, error-rate, latency-p95, availability,
                            error-budget-remaining, or deployment-condition.
                          type: string
                        passed:
                          description: Passed reports whether the value was within
                            the threshold.
                          type: boolean
                        query:
                          description: Query is the PromQL sent, or for Kubernetes
                            the object and field read.
                          type: string
                        source:
                          description: Source is prometheus or kubernetes.
                          enum:
                          - prometheus
                          - kubernetes
                          type: string
                        threshold:
                          description: Threshold is the limit the value was judged
                            against, if any.
                          type: string
                        value:
                          description: |-
                            Value is what came back, as text, so the record is the same in every
                            language that verifies it; "absent" when the query returned no data.
                          type: string
                      required:
                      - evaluatedAt
                      - name
                      - query
                      - source
                      - value
                      type: object
                    maxItems: 20
                    type: array
                  lastMessage:
                    type: string
                  lastResult:
                    description: LastResult is pass, fail or inconclusive.
                    type: string
                  latencyP95Ms:
                    type: number
                  requests:
                    type: number
                type: object
              archivedSequence:
                description: |-
                  ArchivedSequence is the last decision the archive outside the cluster
                  has accepted; decisions after it are still to be sent.
                format: int64
                type: integer
              availableReplicas:
                format: int32
                type: integer
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              deploymentGeneration:
                format: int64
                type: integer
              deploymentRef:
                type: string
              desiredReplicas:
                format: int32
                type: integer
              healthyGeneration:
                format: int64
                type: integer
              healthyRevision:
                description: |-
                  HealthyRevision, HealthyTemplateHash and HealthyGeneration identify the
                  last ReplicaSet the controller saw fully rolled out. Rollback restores
                  this template and nothing else.
                type: string
              healthyTemplateHash:
                type: string
              lastDecision:
                description: |-
                  LastDecision is the head of the guard's chain of RolloutDecisions:
                  the next decision links to it.
                properties:
                  hash:
                    type: string
                  name:
                    type: string
                  sequence:
                    format: int64
                    type: integer
                required:
                - hash
                - name
                - sequence
                type: object
              message:
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: |-
                  Phase is Progressing, Healthy, Verifying, Paused, Blocked, RolledBack
                  or RollbackFailed.
                type: string
              reason:
                type: string
              rollbackEnabled:
                type: boolean
              rollbackFromTemplateHash:
                type: string
              rollbackRevision:
                description: |-
                  RollbackRevision and RollbackTemplateHash record the last rollback.
                  RollbackFromTemplateHash is the template it rolled away from: if that
                  template comes back (GitOps self-heal, a manual apply), the controller
                  reports it instead of rolling back again. Cleared once a different
                  revision rolls out healthy.
                type: string
              rollbackTemplateHash:
                type: string
              serviceRef:
                type: string
              sloGate:
                description: SLOGate is the gate's verdict on the latest revision
                  it checked.
                properties:
                  evaluatedAt:
                    type: string
                  gate:
                    description: Gate is allowed, blocked or unknown.
                    type: string
                  paused:
                    description: Paused reports whether the controller has the rollout
                      paused now.
                    type: boolean
                  reason:
                    type: string
                  resumed:
                    description: |-
                      Resumed reports whether the controller resumed the rollout after the
                      gate allowed it again.
                    type: boolean
                  revision:
                    type: string
                  templateHash:
                    type: string
                required:
                - evaluatedAt
                - gate
                - templateHash
                type: object
              strategy:
                type: string
              updatedReplicas:
                format: int32
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
