# Deploys the controller from a locally built image for the kind end-to-end
# test (scripts/e2e-rollback.sh). Build and load it first:
#   docker build -f controller/Dockerfile -t attesta-controller:e2e .
#   kind load docker-image attesta-controller:e2e --name <cluster>
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../deploy/controller
images:
  - name: ghcr.io/gaurav-gs7/attesta-controller
    newName: attesta-controller
    newTag: e2e
patches:
  # Point metric analysis at the in-cluster Prometheus stub the test deploys.
  - target:
      kind: Deployment
      name: attesta-controller
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --prometheus-url=http://prom-stub.attesta-e2e.svc:9090
